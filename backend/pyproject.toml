[project]
name = "office-tools-api"
version = "0.1.0"
description = "Excel, CSV, QR code and MAC address tools API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "charset-normalizer>=3.4.4",
  "fastapi==0.162.2",
  "openpyxl==3.1.5",
  "pillow==13.0.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.22",
  "qrcode==8.2",
  "uvicorn[standard]==0.54.0",
  "xlrd==2.0.2",
  "zxing-cpp==3.1.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "pytest==9.2.0",
  "ruff>=0.15.0",
  "xlwt==1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

